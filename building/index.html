<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Conference Center Sunday Rooms</title>
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-title" content="CC Rooms">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f3a5f'/%3E%3Cpath d='M6 32 L32 10 L58 32 Z' fill='white'/%3E%3Crect x='14' y='34' width='5' height='18' fill='white'/%3E%3Crect x='45' y='34' width='5' height='18' fill='white'/%3E%3Crect x='10' y='52' width='44' height='4' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f2f4f7; --card: #ffffff; --border: #d9e0e8; --heading: #1f3a5f;
    --text: #24313f; --muted: #5b6b7b; --head-bg: #e8edf3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a20; --card: #1d242c; --border: #313c48; --heading: #cfe0f4;
      --text: #d5dde5; --muted: #93a1b0; --head-bg: #232c36;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif; }
  a { color: var(--heading); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 50px; }
  .head { text-align: center; padding: 12px 0 10px; }
  .head h1 { margin: 8px 0 2px; font-size: 24px; color: var(--heading);
             text-wrap: balance; }
  .head p { margin: 0; color: var(--muted); font-size: 14px; }
  .tabs { display: flex; justify-content: center; gap: 8px; margin: 14px 0 18px; }
  .tabs button { font: inherit; font-size: 16px; padding: 8px 18px; cursor: pointer;
                 border: 1px solid var(--border); border-radius: 20px;
                 background: var(--card); color: var(--text); }
  .tabs button.on { background: var(--heading); color: #fff; border-color: var(--heading); }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 2px; font-size: 17px; color: var(--heading);
             display: flex; align-items: center; gap: 8px; }
  .chip { width: 14px; height: 14px; border-radius: 4px; flex: none;
          border: 1px solid rgba(0,0,0,.15); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 15px; letter-spacing: .04em; text-transform: uppercase;
       color: var(--muted); margin: 22px 4px 10px; }
  ul.uses { list-style: none; margin: 0; padding: 0; }
  ul.uses li { display: flex; gap: 10px; padding: 5px 0;
               border-top: 1px solid var(--border); align-items: baseline; }
  ul.uses li:first-child { border-top: none; }
  .time { color: var(--muted); font-size: 14px; white-space: nowrap; flex: none;
          width: 128px; font-variant-numeric: tabular-nums; }
  .what b { font-weight: 600; }
  .roomtag { color: var(--muted); }
  .notice { white-space: pre-wrap; }
  #status { text-align: center; color: var(--muted); padding: 30px 0; }
  .foot { text-align: center; color: var(--muted); font-size: 14px; margin-top: 20px; }
  .confcard { border: 1px solid #c96a6a; }
  .confcard h3 { color: #b03030; }
  .conflict { color: #b03030; font-weight: 600; font-size: 13px;
              border: 1px solid #c96a6a; border-radius: 4px; padding: 0 6px;
              margin-left: 6px; white-space: nowrap; }
  @media (prefers-color-scheme: dark) {
    .confcard h3, .conflict { color: #f1a5a5; }
  }
  .gridwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px;
              background: var(--card); }
  table.grid { border-collapse: separate; border-spacing: 0; }
  table.grid th.roomh { position: sticky; top: 0; z-index: 2; background: var(--head-bg);
    font-size: 13px; padding: 6px 8px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
    color: var(--heading); }
  table.grid .timec { position: sticky; left: 0; z-index: 1; background: var(--head-bg);
    font-size: 12px; color: var(--muted); padding: 0 8px; white-space: nowrap;
    text-align: right; border-right: 1px solid var(--border); vertical-align: top;
    font-variant-numeric: tabular-nums; }
  table.grid th.corner { z-index: 3; }
  table.grid td.slot { min-width: 88px; height: 14px; padding: 0;
    border-right: 1px solid var(--border); }
  table.grid tr.h td, table.grid tr.h .timec { border-bottom: 1px solid var(--border); }
  table.grid td.block { font-size: 12px; line-height: 1.25; padding: 3px 5px;
    vertical-align: top; border-radius: 0; }
  table.grid td.block b { display: block; font-weight: 600; }
  table.grid td.clash { outline: 2px solid #c9302c; outline-offset: -2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>BYU Conference Center — Sunday Rooms</h1>
    <p>Room assignments for the 4th and 20th Stakes</p>
  </div>

  <div class="card" id="noticecard" hidden>
    <h3>Notices</h3>
    <p class="notice" id="notice"></p>
  </div>

  <div class="card confcard" id="confcard" hidden>
    <h3>Scheduling conflicts</h3>
    <ul class="uses" id="conflist"></ul>
  </div>

  <div class="tabs">
    <button id="tabward" class="on" type="button">By ward</button>
    <button id="tabroom" type="button">By room</button>
    <button id="tabgrid" type="button">Grid</button>
  </div>

  <p id="status">Loading&hellip;</p>
  <div id="byward" hidden></div>
  <div id="byroom" hidden></div>
  <div id="bygrid" hidden></div>

  <p class="foot">Pavilion &amp; patio reservations are separate:
    <a href="../">the pavilion calendar</a>.</p>
</div>

<script>
(function () {
  var SOURCE = "../rooms.json?v=" + Date.now();

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== "") e.textContent = text;
    return e;
  }

  function mins(t) {
    var p = t.split(":"); return (+p[0]) * 60 + (+p[1]);
  }

  function fmt(t) {
    var m = mins(t), h = Math.floor(m / 60), mm = m % 60;
    var ap = h < 12 ? "AM" : "PM"; var h12 = h % 12 || 12;
    return h12 + ":" + String(mm).padStart(2, "0") + " " + ap;
  }

  function range(a, b) {
    var fa = fmt(a), fb = fmt(b);
    var pa = fa.slice(-2), pb = fb.slice(-2);
    return (pa === pb ? fa.slice(0, -3) : fa) + "–" + fb;
  }

  function chip(color) {
    var c = el("span", "chip"); c.style.background = color; return c;
  }

  function useKey(ward, u) {
    return [u.room, u.start, u.end, ward, u.what].join("|");
  }

  function findConflicts(data) {
    var all = [];
    data.stakes.forEach(function (st) {
      st.wards.forEach(function (w) {
        w.uses.forEach(function (u) {
          all.push({room: u.room, s: mins(u.start), e: mins(u.end),
                    ward: w.name, u: u, key: useKey(w.name, u)});
        });
      });
    });
    var marked = {}, pairs = [];
    for (var i = 0; i < all.length; i++) {
      for (var j = i + 1; j < all.length; j++) {
        var a = all[i], b = all[j];
        if (a.room === b.room && a.s < b.e && b.s < a.e) {
          marked[a.key] = true; marked[b.key] = true;
          pairs.push("Room " + a.room + ": " + a.ward + " " +
                     range(a.u.start, a.u.end) + " overlaps " + b.ward + " " +
                     range(b.u.start, b.u.end));
        }
      }
    }
    return {marked: marked, pairs: pairs};
  }

  function renderByWard(data) {
    var root = document.getElementById("byward");
    data.stakes.forEach(function (st) {
      root.appendChild(el("h2", "", st.name));
      st.wards.forEach(function (w) {
        var card = el("div", "card");
        var h = el("h3");
        h.appendChild(chip(w.color));
        h.appendChild(document.createTextNode(w.name +
          (w.bishop ? " — Bishop " + w.bishop : "")));
        card.appendChild(h);
        if (w.sacrament)
          card.appendChild(el("p", "sub", "Sacrament meeting at " + w.sacrament));
        var ul = el("ul", "uses");
        w.uses.slice().sort(function (a, b) { return mins(a.start) - mins(b.start); })
          .forEach(function (u) {
            var li = document.createElement("li");
            li.appendChild(el("span", "time", range(u.start, u.end)));
            var span = el("span", "what");
            if (u.what) {
              var b = el("b", "", u.what); span.appendChild(b);
              span.appendChild(document.createTextNode(" · "));
            }
            span.appendChild(el("span", "roomtag", "Room " + u.room));
            if (conf.marked[useKey(w.name, u)])
              span.appendChild(el("span", "conflict", "CONFLICT"));
            li.appendChild(span);
            ul.appendChild(li);
          });
        card.appendChild(ul);
        root.appendChild(card);
      });
    });
  }

  function renderByRoom(data) {
    var root = document.getElementById("byroom");
    var byroom = {};
    data.stakes.forEach(function (st) {
      st.wards.forEach(function (w) {
        w.uses.forEach(function (u) {
          (byroom[u.room] = byroom[u.room] || []).push(
            {start: u.start, end: u.end, what: u.what, ward: w.name,
             color: w.color, key: useKey(w.name, u)});
        });
      });
    });
    var listed = {};
    data.rooms.forEach(function (g) {
      root.appendChild(el("h2", "", g.group));
      g.list.forEach(function (r) {
        listed[r.id] = true;
        var card = el("div", "card");
        card.appendChild(el("h3", "", "Room " + r.id + (r.info ? " · " + r.info : "")));
        var uses = (byroom[r.id] || []).sort(function (a, b) {
          return mins(a.start) - mins(b.start);
        });
        if (!uses.length) {
          card.appendChild(el("p", "sub", "Not scheduled on Sundays"));
        } else {
          var ul = el("ul", "uses");
          uses.forEach(function (u) {
            var li = document.createElement("li");
            li.appendChild(el("span", "time", range(u.start, u.end)));
            var span = el("span", "what");
            span.appendChild(chip(u.color));
            span.appendChild(document.createTextNode(" "));
            var b = el("b", "", u.ward); span.appendChild(b);
            if (u.what) span.appendChild(document.createTextNode(" · " + u.what));
            if (conf.marked[u.key]) span.appendChild(el("span", "conflict", "CONFLICT"));
            li.appendChild(span);
            ul.appendChild(li);
          });
          card.appendChild(ul);
        }
        root.appendChild(card);
      });
      });
    // rooms used in the data but missing from the room list still show
    var extra = Object.keys(byroom).filter(function (id) { return !listed[id]; });
    if (extra.length) {
      root.appendChild(el("h2", "", "Other rooms"));
      extra.sort().forEach(function (id) {
        var card = el("div", "card");
        card.appendChild(el("h3", "", "Room " + id));
        var ul = el("ul", "uses");
        byroom[id].sort(function (a, b) { return mins(a.start) - mins(b.start); })
          .forEach(function (u) {
            var li = document.createElement("li");
            li.appendChild(el("span", "time", range(u.start, u.end)));
            var span = el("span", "what");
            span.appendChild(chip(u.color));
            span.appendChild(document.createTextNode(" "));
            span.appendChild(el("b", "", u.ward));
            if (u.what) span.appendChild(document.createTextNode(" · " + u.what));
            if (conf.marked[u.key]) span.appendChild(el("span", "conflict", "CONFLICT"));
            li.appendChild(span);
            ul.appendChild(li);
          });
        card.appendChild(ul);
        root.appendChild(card);
      });
    }
  }

  function textOn(bg) {
    var m = bg.replace("#", "");
    if (m.length === 3) m = m[0]+m[0]+m[1]+m[1]+m[2]+m[2];
    var r = parseInt(m.slice(0,2),16), g = parseInt(m.slice(2,4),16), b = parseInt(m.slice(4,6),16);
    return (r*299 + g*587 + b*114) / 1000 > 140 ? "#1c2733" : "#ffffff";
  }

  function renderGrid(data) {
    var START = 7 * 60, END = 16 * 60 + 30, STEP = 15;
    // rooms in listed order, but only the ones something uses
    var byroom = {};
    data.stakes.forEach(function (st) {
      st.wards.forEach(function (w) {
        w.uses.forEach(function (u) {
          (byroom[u.room] = byroom[u.room] || []).push(
            {s: mins(u.start), e: mins(u.end), ward: w.name, what: u.what,
             color: w.color, start: u.start, end: u.end});
        });
      });
    });
    var cols = [];
    data.rooms.forEach(function (g) {
      g.list.forEach(function (r) { if (byroom[r.id]) cols.push(r.id); });
    });
    Object.keys(byroom).sort().forEach(function (id) {
      if (cols.indexOf(id) < 0) cols.push(id);
    });

    // per room: merge overlapping uses into one cell so the grid stays a grid
    var segs = {};
    cols.forEach(function (id) {
      var list = byroom[id].sort(function (a, b) { return a.s - b.s; });
      var out = [];
      list.forEach(function (u) {
        var last = out[out.length - 1];
        if (last && u.s < last.e) {
          last.e = Math.max(last.e, u.e);
          last.items.push(u); last.clash = true;
        } else {
          out.push({s: u.s, e: u.e, items: [u], clash: false});
        }
      });
      segs[id] = out;
    });

    function shortWard(n) {
      return n === "Any ward (shared)" ? "Shared" : n.replace(" Ward", "");
    }

    var wrapDiv = el("div", "gridwrap");
    var table = el("table", "grid");
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    var corner = el("th", "roomh timec corner", "");
    hr.appendChild(corner);
    cols.forEach(function (id) { hr.appendChild(el("th", "roomh", id)); });
    thead.appendChild(hr); table.appendChild(thead);

    var tbody = document.createElement("tbody");
    var covered = {};   // room -> slots already spanned
    cols.forEach(function (id) { covered[id] = {}; });
    for (var m = START; m < END; m += STEP) {
      var tr = document.createElement("tr");
      if ((m + STEP) % 60 === 0) tr.className = "h";
      var t = Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
      var lab = (m % 30 === 0) ? fmt(t).replace(":00", "") : "";
      tr.appendChild(el("td", "timec", lab));
      cols.forEach(function (id) {
        if (covered[id][m]) return;
        var seg = null;
        segs[id].forEach(function (g) { if (g.s === m || (g.s < m && m === START && g.e > m)) seg = seg || g; });
        // a segment starting before the visible window still needs a cell
        if (!seg) segs[id].forEach(function (g) { if (g.s === m) seg = g; });
        if (seg) {
          var from = Math.max(seg.s, START);
          if (from !== m) { seg = null; }
        }
        if (seg) {
          var to = Math.min(seg.e, END);
          var span = Math.ceil((to - m) / STEP);
          for (var k = m; k < to; k += STEP) covered[id][k] = true;
          var td = el("td", "slot block" + (seg.clash ? " clash" : ""));
          td.rowSpan = span;
          var one = seg.items[0];
          td.style.background = seg.clash ? "#f3d1d1" : one.color;
          td.style.color = seg.clash ? "#7a1d1d" : textOn(one.color);
          seg.items.forEach(function (u) {
            var b = el("b", "", shortWard(u.ward) + (u.what ? " · " + u.what : ""));
            td.appendChild(b);
          });
          if (seg.clash) td.appendChild(el("b", "", "CONFLICT"));
          td.title = seg.items.map(function (u) {
            return u.ward + " " + range(u.start, u.end) + (u.what ? " — " + u.what : "");
          }).join("; ");
          tr.appendChild(td);
        } else {
          tr.appendChild(el("td", "slot", ""));
        }
      });
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    wrapDiv.appendChild(table);
    document.getElementById("bygrid").appendChild(wrapDiv);
  }

  function tabs() {
    var btns = [["tabward", "byward"], ["tabroom", "byroom"], ["tabgrid", "bygrid"]];
    btns.forEach(function (pair) {
      document.getElementById(pair[0]).addEventListener("click", function () {
        btns.forEach(function (q) {
          document.getElementById(q[0]).className = (q[0] === pair[0]) ? "on" : "";
          document.getElementById(q[1]).hidden = q[1] !== pair[1];
        });
      });
    });
  }

  var conf = {marked: {}, pairs: []};

  fetch(SOURCE, {cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      conf = findConflicts(data);
      if (conf.pairs.length) {
        var cl = document.getElementById("conflist");
        conf.pairs.forEach(function (p) {
          var li = document.createElement("li"); li.textContent = p; cl.appendChild(li);
        });
        document.getElementById("confcard").hidden = false;
      }
      if (data.note) {
        document.getElementById("notice").textContent = data.note;
        document.getElementById("noticecard").hidden = false;
      }
      renderByWard(data);
      renderByRoom(data);
      renderGrid(data);
      tabs();
      document.getElementById("status").hidden = true;
      document.getElementById("byward").hidden = false;
    })
    .catch(function () {
      document.getElementById("status").textContent =
        "The schedule can’t be reached right now. Please try again in a few minutes.";
    });
})();
</script>
</body>
</html>
