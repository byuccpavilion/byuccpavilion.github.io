<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Conference Center Sunday Rooms — Editing</title>
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-title" content="CC Rooms Edit">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f3a5f'/%3E%3Cpath d='M6 32 L32 10 L58 32 Z' fill='white'/%3E%3Crect x='14' y='34' width='5' height='18' fill='white'/%3E%3Crect x='45' y='34' width='5' height='18' fill='white'/%3E%3Crect x='10' y='52' width='44' height='4' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f2f4f7; --card: #ffffff; --border: #d9e0e8; --heading: #1f3a5f;
    --text: #24313f; --muted: #5b6b7b; --ok: #065f46; --err: #991b1b;
    --head-bg: #e8edf3; --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a20; --card: #1d242c; --border: #313c48; --heading: #cfe0f4;
      --text: #d5dde5; --muted: #93a1b0; --ok: #7fd7ab; --err: #f1a5a5;
      --head-bg: #232c36; --input-bg: #10151b;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif; }
  a { color: var(--heading); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 14px 50px; }
  .head { text-align: center; padding: 12px 0 10px; }
  .head h1 { margin: 8px 0 2px; font-size: 22px; color: var(--heading);
             text-wrap: balance; }
  .head p { margin: 0; color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 17px; color: var(--heading); }
  h2 { font-size: 15px; letter-spacing: .04em; text-transform: uppercase;
       color: var(--muted); margin: 22px 4px 10px; }
  input[type=text], textarea, select {
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 16px; }
  textarea { width: 100%; box-sizing: border-box; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #9db8d8; }
  button { background: var(--heading); color: #fff; border: none; border-radius: 6px;
           padding: 8px 16px; font: inherit; font-size: 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.light { background: var(--head-bg); color: var(--text);
                 border: 1px solid var(--border); }
  button.danger { background: var(--input-bg); color: var(--err);
                  border: 1px solid #c96a6a; }
  button.small { font-size: 14px; padding: 5px 10px; }
  .fields { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .fields label { display: flex; flex-direction: column; font-size: 13px;
                  color: var(--muted); gap: 2px; }
  .userow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
            padding: 6px 0; border-top: 1px dashed var(--border); }
  .userow:first-of-type { border-top: none; }
  .userow input.what { flex: 1; min-width: 120px; }
  .userow input.room { width: 150px; }
  .msg { font-size: 14px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); white-space: pre-wrap; }
  .row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .confcard { border: 1px solid #c96a6a; }
  .confcard h3 { color: var(--err); }
  #status { text-align: center; color: var(--muted); padding: 30px 0; }
  @media (max-width: 640px) {
    .userow input.room, .userow select, .userow input.what { flex: 1 1 100%; width: auto; }
    .userow button { width: 100%; }
    .fields label { flex: 1 1 45%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Conference Center Sunday Rooms</h1>
    <p>Editing page</p>
    <p style="margin-top:10px"><a href="../" target="_blank" rel="noopener"
      style="display:inline-block;background:var(--head-bg);border:1px solid var(--border);
             border-radius:6px;padding:8px 14px;text-decoration:none">
      See the public page</a></p>
  </div>

  <p id="status">Opening the schedule&hellip;</p>

  <div id="editor" hidden>
    <div class="card confcard" id="confcard" hidden>
      <h3>Scheduling conflicts in the current plan</h3>
      <div id="conflist" class="msg err"></div>
    </div>

    <div class="card">
      <h3>Notices shown on the public page</h3>
      <textarea id="note" rows="3"></textarea>
      <div class="row2">
        <button id="savenote" type="button">Save notice</button>
        <span class="msg" id="notemsg"></span>
      </div>
    </div>

    <div id="stakes"></div>
  </div>
  <datalist id="roomlist"></datalist>
</div>

<script>
(function () {
  var API = "https://api.github.com/repos/byuccpavilion/byuccpavilion.github.io/contents/rooms.json";
  var key = location.hash.slice(1);
  var status = document.getElementById("status");
  if (!key) {
    status.textContent = "This editing page only opens through the private link.";
    return;
  }

  var sha = null, data = null;

  function hdrs() {
    return {"Authorization": "Bearer " + key,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"};
  }
  function decode(b64) {
    var bin = atob(b64.replace(/\n/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  function encode(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function mins(t) { var p = t.split(":"); return (+p[0]) * 60 + (+p[1]); }
  function fmt(t) {
    var m = mins(t), h = Math.floor(m / 60), mm = m % 60;
    return (h % 12 || 12) + ":" + String(mm).padStart(2, "0") + " " + (h < 12 ? "AM" : "PM");
  }
  function range(a, b) { return fmt(a) + "–" + fmt(b); }

  function timeOptions(sel, value) {
    for (var m = 7 * 60; m <= 17 * 60; m += 15) {
      var t = Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
      var o = document.createElement("option");
      o.value = t; o.textContent = fmt(t);
      if (t === value) o.selected = true;
      sel.appendChild(o);
    }
  }

  // every use in the plan, except the ward being re-saved
  function otherUses(skipWard) {
    var out = [];
    data.stakes.forEach(function (st) {
      st.wards.forEach(function (w) {
        if (w === skipWard) return;
        w.uses.forEach(function (u) {
          out.push({room: u.room, s: mins(u.start), e: mins(u.end),
                    ward: w.name, start: u.start, end: u.end});
        });
      });
    });
    return out;
  }

  function conflictsFor(uses, skipWard, wardName) {
    var others = otherUses(skipWard), problems = [];
    uses.forEach(function (u, i) {
      var s = mins(u.start), e = mins(u.end);
      if (e <= s) {
        problems.push(u.room + " " + range(u.start, u.end) + ": the end time must be after the start.");
        return;
      }
      others.forEach(function (o) {
        if (o.room === u.room && s < o.e && o.s < e)
          problems.push("Room " + u.room + " is already taken " + range(o.start, o.end) +
                        " by " + o.ward + " — your " + range(u.start, u.end) + " overlaps it.");
      });
      uses.forEach(function (v, j) {
        if (j > i && v.room === u.room && s < mins(v.end) && mins(v.start) < e)
          problems.push("Two of " + wardName + "'s own entries overlap in room " + u.room + ".");
      });
    });
    return problems;
  }

  function fullConflictList() {
    var all = [];
    data.stakes.forEach(function (st) {
      st.wards.forEach(function (w) {
        w.uses.forEach(function (u) {
          all.push({room: u.room, s: mins(u.start), e: mins(u.end),
                    ward: w.name, start: u.start, end: u.end});
        });
      });
    });
    var out = [];
    for (var i = 0; i < all.length; i++)
      for (var j = i + 1; j < all.length; j++) {
        var a = all[i], b = all[j];
        if (a.room === b.room && a.s < b.e && b.s < a.e)
          out.push("Room " + a.room + ": " + a.ward + " " + range(a.start, a.end) +
                   " overlaps " + b.ward + " " + range(b.start, b.end));
      }
    return out;
  }

  function refreshConflictCard() {
    var list = fullConflictList();
    var card = document.getElementById("confcard");
    document.getElementById("conflist").textContent = list.join("\n");
    card.hidden = !list.length;
  }

  function save(what, msgEl, btn) {
    if (btn) btn.disabled = true;
    msgEl.textContent = "Saving…"; msgEl.className = "msg";
    return fetch(API, {
      method: "PUT", headers: hdrs(),
      body: JSON.stringify({message: what, sha: sha,
                            content: encode(JSON.stringify(data, null, 1))})
    }).then(function (r) {
      if (r.status === 409) throw new Error("conflict");
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (j) {
      sha = j.content.sha;
      msgEl.textContent = "Saved."; msgEl.className = "msg ok";
      if (btn) btn.disabled = false;
      setTimeout(function () { msgEl.textContent = ""; }, 4000);
      refreshConflictCard();
      return true;
    }).catch(function (e) {
      if (btn) btn.disabled = false;
      msgEl.className = "msg err";
      msgEl.textContent = String(e.message) === "conflict"
        ? "Someone else saved just now — reload this page and redo your change."
        : "Could not save — check your connection and try again.";
      return false;
    });
  }

  function useRow(u) {
    var row = document.createElement("div"); row.className = "userow";
    var room = document.createElement("input");
    room.type = "text"; room.className = "room"; room.placeholder = "Room";
    room.setAttribute("list", "roomlist"); room.value = u.room || "";
    var st = document.createElement("select"); timeOptions(st, u.start || "9:00");
    var en = document.createElement("select"); timeOptions(en, u.end || "10:00");
    var what = document.createElement("input");
    what.type = "text"; what.className = "what";
    what.placeholder = "What (Sacrament, RS, EQ, Interviews…)"; what.value = u.what || "";
    var del = document.createElement("button");
    del.type = "button"; del.className = "danger small"; del.textContent = "Remove";
    del.addEventListener("click", function () { row.remove(); });
    row.appendChild(room); row.appendChild(st); row.appendChild(en);
    row.appendChild(what); row.appendChild(del);
    row._get = function () {
      return {room: room.value.trim(), start: st.value, end: en.value,
              what: what.value.trim()};
    };
    return row;
  }

  function wardCard(stake, w) {
    var card = document.createElement("div"); card.className = "card";
    var flds = document.createElement("div"); flds.className = "fields";
    function fld(label, val, width) {
      var lab = document.createElement("label");
      lab.appendChild(document.createTextNode(label));
      var inp = document.createElement("input");
      inp.type = "text"; inp.value = val || ""; if (width) inp.style.width = width;
      lab.appendChild(inp); flds.appendChild(lab);
      return inp;
    }
    var name = fld("Ward", w.name, "130px");
    var bishop = fld("Bishop", w.bishop, "120px");
    var sac = fld("Sacrament time", w.sacrament, "110px");
    var collab = document.createElement("label");
    collab.appendChild(document.createTextNode("Color"));
    var color = document.createElement("input");
    color.type = "color"; color.value = w.color || "#888888";
    color.style.width = "48px"; color.style.height = "38px";
    collab.appendChild(color); flds.appendChild(collab);
    card.appendChild(flds);

    var rows = document.createElement("div");
    w.uses.slice().sort(function (a, b) { return mins(a.start) - mins(b.start); })
      .forEach(function (u) { rows.appendChild(useRow(u)); });
    card.appendChild(rows);

    var add = document.createElement("button");
    add.type = "button"; add.className = "light small";
    add.textContent = "+ Add a room booking";
    add.addEventListener("click", function () { rows.appendChild(useRow({})); });

    var saveBtn = document.createElement("button");
    saveBtn.type = "button"; saveBtn.textContent = "Save " + (w.name || "this ward");
    var msg = document.createElement("span"); msg.className = "msg";

    var removeBtn = document.createElement("button");
    removeBtn.type = "button"; removeBtn.className = "danger small";
    removeBtn.textContent = "Remove this ward";
    removeBtn.addEventListener("click", function () {
      if (!confirm("Remove " + (w.name || "this ward") + " and all its bookings?")) return;
      stake.wards.splice(stake.wards.indexOf(w), 1);
      save("Remove ward: " + w.name, msg, null).then(function (ok) {
        if (ok) card.remove();
      });
    });

    var bar = document.createElement("div"); bar.className = "row2";
    bar.appendChild(add); bar.appendChild(saveBtn); bar.appendChild(removeBtn);
    bar.appendChild(msg);
    card.appendChild(bar);

    saveBtn.addEventListener("click", function () {
      var uses = [];
      Array.prototype.forEach.call(rows.children, function (r) {
        var u = r._get();
        if (u.room) uses.push(u);
      });
      var problems = conflictsFor(uses, w, name.value.trim() || "this ward");
      if (problems.length) {
        msg.className = "msg err";
        msg.textContent = "Not saved — fix these first:\n" + problems.join("\n");
        return;
      }
      w.name = name.value.trim(); w.bishop = bishop.value.trim();
      w.sacrament = sac.value.trim(); w.color = color.value;
      w.uses = uses;
      save("Rooms: " + w.name, msg, saveBtn);
    });

    return card;
  }

  function build() {
    document.getElementById("note").value = data.note || "";
    document.getElementById("savenote").addEventListener("click", function () {
      data.note = document.getElementById("note").value.trim();
      save("Rooms notice", document.getElementById("notemsg"), this);
    });

    var dl = document.getElementById("roomlist");
    (data.rooms || []).forEach(function (g) {
      g.list.forEach(function (r) {
        var o = document.createElement("option"); o.value = r.id; dl.appendChild(o);
      });
    });

    var root = document.getElementById("stakes");
    data.stakes.forEach(function (st) {
      var h = document.createElement("h2"); h.textContent = st.name;
      root.appendChild(h);
      st.wards.forEach(function (w) { root.appendChild(wardCard(st, w)); });
      var addW = document.createElement("button");
      addW.type = "button"; addW.className = "light";
      addW.textContent = "+ Add a ward to the " + st.name;
      addW.addEventListener("click", function () {
        var w = {name: "", bishop: "", sacrament: "", color: "#888888", uses: []};
        st.wards.push(w);
        root.insertBefore(wardCard(st, w), addW);
      });
      root.appendChild(addW);
    });

    refreshConflictCard();
    status.hidden = true;
    document.getElementById("editor").hidden = false;
  }

  fetch(API + "?v=" + Date.now(), {headers: hdrs(), cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      sha = j.sha;
      data = JSON.parse(decode(j.content));
      build();
    })
    .catch(function (e) {
      status.textContent = (String(e.message) === "401" || String(e.message) === "403" ||
                            String(e.message) === "404")
        ? "This editing link is no longer valid. Ask for a fresh one."
        : "The schedule can’t be reached right now. Please try again in a few minutes.";
    });
})();
</script>
</body>
</html>
