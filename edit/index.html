<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BYU Conference Center Pavilion — Editing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f3a5f'/%3E%3Cpath d='M6 32 L32 10 L58 32 Z' fill='white'/%3E%3Crect x='14' y='34' width='5' height='18' fill='white'/%3E%3Crect x='45' y='34' width='5' height='18' fill='white'/%3E%3Crect x='10' y='52' width='44' height='4' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f2f4f7; --card: #ffffff; --border: #d9e0e8; --heading: #1f3a5f;
    --text: #24313f; --muted: #5b6b7b; --ok: #065f46; --err: #991b1b;
    --head-bg: #e8edf3; --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a20; --card: #1d242c; --border: #313c48; --heading: #cfe0f4;
      --text: #d5dde5; --muted: #93a1b0; --ok: #7fd7ab; --err: #f1a5a5;
      --head-bg: #232c36; --input-bg: #10151b;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif; }
  a { color: var(--heading); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 50px; }
  .head { text-align: center; padding: 12px 0 16px; }
  .head h1 { margin: 8px 0 2px; font-size: 22px; color: var(--heading);
             text-wrap: balance; }
  .head p { margin: 0; color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 8px; padding: 16px 18px; margin-bottom: 18px; }
  .card h2 { font-size: 16px; margin: 0 0 10px; color: var(--heading); }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th { text-align: left; font-size: 12px; letter-spacing: .04em;
       text-transform: uppercase; color: var(--muted); background: var(--head-bg);
       padding: 8px 10px; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  input[type=text], input[type=email], textarea {
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { width: 100%; box-sizing: border-box; }
  input:focus, textarea:focus { outline: 2px solid #9db8d8; }
  button { background: var(--heading); color: #fff; border: none; border-radius: 6px;
           padding: 6px 14px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  td form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  td form input[type=text] { flex: 1; min-width: 130px; }
  .msg { font-size: 13px; margin-left: 6px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  #status { text-align: center; color: var(--muted); padding: 30px 0; }
  .row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>BYU Conference Center Pavilion</h1>
    <p>Sunday reservations — editing page</p>
  </div>

  <p id="status">Opening the calendar&hellip;</p>

  <div id="editor" hidden>
    <div class="card">
      <h2>Notices shown on the public page</h2>
      <textarea id="notice" rows="4"
        placeholder="Anything the bishops should know — rules, closures, how far ahead to book…"></textarea>
      <div class="row2">
        <button id="savenotice" type="button">Save notice</button>
        <span class="msg" id="noticemsg"></span>
      </div>
    </div>

    <div class="card">
      <h2>Who to contact for reservations</h2>
      <div class="row2">
        <input type="text" id="cname" placeholder="Name">
        <input type="text" id="cphone" placeholder="Phone">
        <input type="email" id="cemail" placeholder="Email">
        <button id="savecontact" type="button">Save</button>
        <span class="msg" id="contactmsg"></span>
      </div>
    </div>

    <table>
      <thead><tr><th style="width:150px">Sunday</th><th>Reserved by</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p style="color:var(--muted);font-size:13px">To free a Sunday up, clear both
      boxes and press Save. Changes appear on the
      <a href="../">public page</a> within a minute or two.</p>
  </div>
</div>

<script>
(function () {
  var API = "https://api.github.com/repos/byuccpavilion/byuccpavilion.github.io/contents/data.json";
  var key = location.hash.slice(1);
  var status = document.getElementById("status");
  if (!key) {
    status.textContent = "This editing page only opens through the private link. " +
      "If you had it and it stopped working, ask for a fresh one.";
    return;
  }

  var sha = null, data = null;

  function hdrs() {
    return {"Authorization": "Bearer " + key,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"};
  }

  function decode(b64) {
    var bin = atob(b64.replace(/\n/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function encode(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function save(what, msgEl, btn) {
    btn.disabled = true;
    msgEl.textContent = "Saving…"; msgEl.className = "msg";
    return fetch(API, {
      method: "PUT", headers: hdrs(),
      body: JSON.stringify({message: what, sha: sha,
                            content: encode(JSON.stringify(data, null, 1))})
    }).then(function (r) {
      if (r.status === 409) throw new Error("conflict");
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (j) {
      sha = j.content.sha;
      msgEl.textContent = "Saved."; msgEl.className = "msg ok";
      btn.disabled = false;
      setTimeout(function () { msgEl.textContent = ""; }, 4000);
    }).catch(function (e) {
      btn.disabled = false;
      msgEl.className = "msg err";
      if (String(e.message) === "conflict") {
        msgEl.textContent = "Someone else saved just now — reload this page and redo your change.";
      } else if (String(e.message) === "401" || String(e.message) === "403" || String(e.message) === "404") {
        msgEl.textContent = "This editing link is no longer valid.";
      } else {
        msgEl.textContent = "Could not save — check your connection and try again.";
      }
    });
  }

  function sundays(weeks) {
    var out = [], d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
    for (var i = 0; i < weeks; i++) {
      out.push({date: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
                      "-" + String(d.getDate()).padStart(2, "0"),
                label: d.toLocaleDateString("en-US", {month: "long", day: "numeric", year: "numeric"})});
      d.setDate(d.getDate() + 7);
    }
    return out;
  }

  function build() {
    document.getElementById("notice").value = data.notice || "";
    var c = data.contact || {};
    document.getElementById("cname").value = c.name || "";
    document.getElementById("cphone").value = c.phone || "";
    document.getElementById("cemail").value = c.email || "";

    var body = document.getElementById("rows");
    sundays(52).forEach(function (s) {
      var r = (data.reservations || {})[s.date] || {};
      var tr = document.createElement("tr");
      var td1 = document.createElement("td");
      td1.textContent = s.label; td1.style.whiteSpace = "nowrap";
      var td2 = document.createElement("td");
      var form = document.createElement("form");
      var by = document.createElement("input");
      by.type = "text"; by.placeholder = "Available — add ward or group"; by.value = r.by || "";
      var note = document.createElement("input");
      note.type = "text"; note.placeholder = "Time / details"; note.value = r.note || "";
      var btn = document.createElement("button");
      btn.type = "submit"; btn.textContent = "Save";
      var msg = document.createElement("span"); msg.className = "msg";
      form.appendChild(by); form.appendChild(note); form.appendChild(btn); form.appendChild(msg);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        if (!data.reservations) data.reservations = {};
        if (by.value.trim() || note.value.trim()) {
          data.reservations[s.date] = {by: by.value.trim(), note: note.value.trim()};
        } else {
          delete data.reservations[s.date];
        }
        save("Reservation: " + s.label, msg, btn);
      });
      td2.appendChild(form);
      tr.appendChild(td1); tr.appendChild(td2); body.appendChild(tr);
    });

    document.getElementById("savenotice").addEventListener("click", function () {
      data.notice = document.getElementById("notice").value.trim();
      save("Notice", document.getElementById("noticemsg"), this);
    });
    document.getElementById("savecontact").addEventListener("click", function () {
      data.contact = {name: document.getElementById("cname").value.trim(),
                      phone: document.getElementById("cphone").value.trim(),
                      email: document.getElementById("cemail").value.trim()};
      save("Contact", document.getElementById("contactmsg"), this);
    });

    status.hidden = true;
    document.getElementById("editor").hidden = false;
  }

  fetch(API + "?v=" + Date.now(), {headers: hdrs(), cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      sha = j.sha;
      data = JSON.parse(decode(j.content));
      build();
    })
    .catch(function (e) {
      status.textContent = (String(e.message) === "401" || String(e.message) === "403" ||
                            String(e.message) === "404")
        ? "This editing link is no longer valid. Ask for a fresh one."
        : "The calendar can’t be reached right now. Please try again in a few minutes.";
    });
})();
</script>
</body>
</html>
